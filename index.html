<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👶 PROJECT SUKA Baby Gender Reveal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: linear-gradient(rgba(15, 20, 28, 0.94), rgba(15, 20, 28, 0.94)), 
                        linear-gradient(to right, #58a6ff 60%, #ff7b72 40%);
            padding: 45px 40px;
            border-radius: 20px;
            border: 3px solid #58a6ff;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 600px; 
            width: 100%;
            box-sizing: border-box;
            transition: all 0.4s ease;
        }
        @media (max-width: 600px) {
            .card { 
                padding: 30px 20px; 
                background: linear-gradient(rgba(15, 20, 28, 0.94), rgba(15, 20, 28, 0.94)), 
                            linear-gradient(to bottom, #58a6ff 50%, #ff7b72 50%);
            }
        }
        .persistent-banner {
            background: #ff7b72;
            color: #0d1117;
            font-size: 1.15em; 
            font-weight: bold;
            letter-spacing: 1.5px;
            padding: 16px;
            margin: -45px -40px 25px -40px;
            text-transform: uppercase;
        }
        .progress-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .progress-container { background: #21262d; border-radius: 10px; height: 14px; flex-grow: 1; overflow: hidden; border: 1px solid #30363d; }
        .progress-bar { background: #58a6ff; height: 100%; width: 0%; transition: width 0.6s ease; box-shadow: 0 0 12px #58a6ff; }
        .progress-text { color: #58a6ff; font-family: monospace; font-size: 1.2em; font-weight: bold; }
        h2 { color: #58a6ff; margin-bottom: 15px; } 
        p { color: #c9d1d9; font-size: 1.2em; line-height: 1.6; } 
        .briefing-text { text-align: left; background: #0d1117; padding: 25px; border-radius: 12px; border: 1px solid #30363d; font-family: monospace; color: #8b949e; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 15px 0; background: #0d1117; border: 2px solid #30363d; border-radius: 10px; font-size: 1.3em; color: #fff; text-align: center; box-sizing: border-box; }
        input:focus { border-color: #58a6ff; outline: none; }
        .action-btn { background: #238636; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 1.2em; cursor: pointer; font-weight: bold; width: 100%; }
        .error { color: #f85149; font-weight: bold; margin-top: 15px; display: none; }
        .success-box { display: none; background: rgba(35, 134, 54, 0.15); border: 2px dashed #238636; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .shake { animation: shakeAnim 0.4s ease-in-out; border-color: #f85149 !important; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    </style>
</head>
<body>
<div class="card" id="main-card">
    <div class="persistent-banner">OPERATION BABY CHROMOSOME DECRYPTION</div>
    <div class="progress-wrapper">
        <div class="progress-container"><div id="game-progress" class="progress-bar"></div></div>
        <div id="progress-text" class="progress-text">0%</div>
    </div>
 
    <!-- INTRO SCREEN -->
    <div id="intro-screen">
        <h2>Incoming Transmission...</h2>
        <div class="briefing-text">
            &gt; OBJECTIVE: Decrypt Gender Data<br>
            &gt; CLASSIFICATION: Ultra Secret<br><br>
            Scan physical hidden QR nodes around the house. Use their secret string codes here to unlock terminal steps sequentially!
        </div>
        <button class="action-btn" onclick="startHunt()">INITIALIZE MISSION</button>
    </div>

    <!-- GAME TERMINAL ZONE -->
    <div id="game-screen" style="display: none;">
        <h2 id="puzzle-title"></h2>
        <p id="puzzle-clue"></p>
        
        <div id="input-zone">
            <input type="text" id="answer-input" placeholder="Enter password text string" autocomplete="off">
            <button class="action-btn" onclick="verifyAnswer()">Bypass Node Security</button>
            <p class="error" id="error-msg"></p>
        </div>
        
        <div class="success-box" id="success-zone">
            <h3 style="color: #56d364; margin: 0 0 10px 0;">✔ Access Granted</h3>
            <p id="next-location-hint" style="color: #c9d1d9; margin: 0;"></p>
            <br>
            <button class="action-btn" style="background:#2196F3;" onclick="nextStep()">Load Next Terminal Level</button>
        </div>
    </div>
</div>

<script>
    const puzzleData = {
        "1": {
            title: "Level 1: The Base Checkpoint",
            clue: "To bypass the baseline firewall, find and scan the QR Code on the living room entry invitation table. Paste the phrase it shows here:",
            answer: "start-suka-baby-gender-decrypt-game",
            nextHint: "🚨 <b>NODE BREACHED:</b> Now march physically to the <b>Baby Nursery Room</b>. Search the diaper changing shelves for the hidden QR node.",
            pct: "33%"
        },
        "2": {
            title: "Level 2: The Baby Nursery",
            clue: "Mainframe connection active. Locate and scan the Nursery QR code. Paste its hidden text phrase here:",
            answer: "LvL1-unlocked",
            nextHint: "🚨 <b>NODE BREACHED:</b> Move down to the kitchen and inspect the <b>Refrigerator Door</b> surfaces to locate the third code block.",
            pct: "66%"
        },
        "3": {
            title: "Level 3: The Final Override",
            clue: "Final encryption grid reached. Locate and scan the Kitchen Fridge QR code. Paste its text phrase here:",
            answer: "LvL2-unlocked",
            nextHint: "🎯 <b>TOTAL MAINFRAME OVERRIDE ACQUIRED</b>: Use master system bypass code <b>2-0-2-6</b> to crack open the physical mechanical lockbox sitting on the living room coffee table!",
            pct: "100%"
        }
    };

    let activeStep = 1;

    function startHunt() {
        document.getElementById("intro-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";
        loadPuzzle();
    }

    function loadPuzzle() {
        if(activeStep > 3) return;
        document.getElementById("game-progress").style.width = puzzleData[activeStep].pct;
        document.getElementById("progress-text").innerText = puzzleData[activeStep].pct;
        document.getElementById("puzzle-title").innerText = puzzleData[activeStep].title;
        document.getElementById("puzzle-clue").innerHTML = puzzleData[activeStep].clue;
        document.getElementById("answer-input").value = "";
        document.getElementById("input-zone").style.display = "block";
        document.getElementById("success-zone").style.display = "none";
        document.getElementById("error-msg").style.display = "none";
    }

    function verifyAnswer() {
        const input = document.getElementById("answer-input").value.trim().toLowerCase();
        const error = document.getElementById("error-msg");
        const mainCard = document.getElementById("main-card");

        if (input === puzzleData[activeStep].answer) {
            document.getElementById("input-zone").style.display = "none";
            document.getElementById("success-zone").style.display = "block";
            document.getElementById("next-location-hint").innerHTML = puzzleData[activeStep].nextHint;
        } else {
            error.style.display = "block";
            error.innerText = "ACCESS DENIED: String sequence invalid. Try again.";
            mainCard.classList.add("shake");
            setTimeout(() => mainCard.classList.remove("shake"), 400);
        }
    }

    function nextStep() {
        activeStep++;
        loadPuzzle();
    }
</script>
</body>
</html>
