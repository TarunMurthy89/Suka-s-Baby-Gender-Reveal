<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👶 PROJECT BUNDLE INITIALIZATION</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 🖥️ HOST-INDEPENDENT HIGH-TECH MICROCHIP VECTOR GRAPHIC BACKGROUND PATTERN */
            background-color: #0a0e14;
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='160' height='160' viewBox='0 0 160 160'%3E%3Cg fill='%231f2937' fill-opacity='0.35'%3E%3Cpath d='M0 0h20v20H0V0zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm20 0h20v20H30V0zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM0 30h20v20H0V30zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm120-17h20v20h-20V30zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM0 60h20v20H0V60zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm30 0h20v20H40V60zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm110-17h20v20h-20V60zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM0 90h20v20H0V90zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm60 0h20v20H70V90zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm50-17h20v20h-20V90zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM0 120h20v20H0v-20zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm20 0h20v20H30v-20zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm70-17h20v20h-20v-20zm10 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'/%3E%3C/g%3E%3C/svg%3E");
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .card {
            background: #161b22; 
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.35);
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }
        .persistent-banner {
            background: #ff7b72;
            color: #0d1117;
            font-size: 0.95em;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px;
            margin: -30px -30px 25px -30px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { color: #58a6ff; margin-bottom: 10px; font-size: 1.3em; }
        p { color: #c9d1d9; font-size: 1.1em; line-height: 1.5; }
        input {
            width: 90%;
            padding: 12px;
            margin: 20px 0 10px 0;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            font-size: 1.1em;
            color: #fff;
            text-align: center;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #58a6ff;
            outline: none;
        }
        .action-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            margin-top: 10px;
        }
        .action-btn:hover { background: #2ea043; }
        .next-btn {
            background: #2196F3;
            margin-top: 15px;
        }
        .next-btn:hover { background: #1b85db; }
        .error { color: #f85149; font-weight: bold; margin-top: 10px; display: none; }
        .success-box { display: none; background: rgba(35, 134, 54, 0.15); border: 2px dashed #238636; padding: 15px; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="persistent-banner">🖥️ CODENAME: OPERATION SLEEP DEPRIVATION</div>
    
    <h2 id="puzzle-title">Initializing Mainframe...</h2>
    <p id="puzzle-clue">Preparing encryption nodes...</p>
    
    <div id="input-zone">
        <input type="text" id="answer-input" placeholder="Enter override code">
        <br>
        <button class="action-btn" onclick="verifyAnswer()">Bypass Security</button>
        <p class="error" id="error-msg">Access Denied. Incorrect string sequence.</p>
    </div>

    <div class="success-box" id="success-zone">
        <h3 style="color: #56d364; margin: 0 0 10px 0;">✔ Node Successfully Breached</h3>
        <p id="next-location-hint" style="color: #c9d1d9; margin: 0; font-weight: bold;"></p>
        <div id="navigation-zone"></div>
    </div>
</div>

<script>
    const puzzleData = {
        "1": {
            title: "Puzzle 1: The Incubation Metric",
            clue: "Count the total of Papa birth year. Enter the exact number.",
            answer: "1142", 
            nextHint: "Clear proof of baseline intelligence found. Ready for the next node?",
            nextStep: "2" 
        },
        "2": {
            title: "Puzzle 2: The Asset Inventory Check",
            clue: "Decode the anagram hidden in our nursery registry list items: Crib, Blanket, Bottle, Toy. What word do they spell?",
            answer: "baby", 
            nextHint: "Inventory baseline verified. Firewall security crumbling.",
            nextStep: "3" 
        },
        "3": {
            title: "Puzzle 3: The Final Master Key",
            clue: "Solve the remaining riddle to complete the structural payload: What goes up but never comes down? (One word)",
            answer: "age",
            nextHint: "🚨 TOTAL MAINFRAME OVERRIDE ACQUIRED: Use master system bypass code 2-0-2-6 to crack the mechanical lock box on the center table!",
            nextStep: null 
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let currentStep = urlParams.get('step') || "1";

    function renderPuzzle() {
        if (puzzleData[currentStep]) {
            document.getElementById("puzzle-title").innerText = puzzleData[currentStep].title;
            document.getElementById("puzzle-clue").innerText = puzzleData[currentStep].clue;
            document.getElementById("answer-input").value = "";
            document.getElementById("input-zone").style.display = "block";
            document.getElementById("success-zone").style.display = "none";
            document.getElementById("error-msg").style.display = "none";
        } else {
            document.getElementById("puzzle-title").innerText = "Critical Crash";
            document.getElementById("puzzle-clue").innerText = "Invalid scanning pipeline sequence detected.";
            document.getElementById("input-zone").style.display = "none";
        }
    }

    function verifyAnswer() {
        const userInput = document.getElementById("answer-input").value.trim().toLowerCase();
        const correctAnswer = puzzleData[currentStep].answer.toLowerCase();
        const errorMsg = document.getElementById("error-msg");
        const successZone = document.getElementById("success-zone");
        const nextHintText = document.getElementById("next-location-hint");
        const navZone = document.getElementById("navigation-zone");

        if (userInput === correctAnswer) {
            errorMsg.style.display = "none";
            successZone.style.display = "block";
            nextHintText.innerText = puzzleData[currentStep].nextHint;
            document.getElementById("input-zone").style.display = "none"; 

            if (puzzleData[currentStep].nextStep) {
                navZone.innerHTML = `<button class="action-btn next-btn" onclick="goToNextStep('${puzzleData[currentStep].nextStep}')">Advance to Next Question</button>`;
            } else {
                navZone.innerHTML = ""; 
            }
        } else {
            errorMsg.style.display = "block";
            errorMsg.innerText = "CRITICAL FAILURE: Incorrect decryption code. Try again.";
        }
    }

    function goToNextStep(nextStepID) {
        currentStep = nextStepID;
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?step=' + currentStep;
        window.history.pushState({path:newUrl}, '', newUrl);
        renderPuzzle();
    }

    renderPuzzle();
</script>
</body>
</html>
